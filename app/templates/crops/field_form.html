{% extends 'base.html' %}{% block title %}Add field · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Add field</h1><p>Record the land area you manage.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Field name *<input name="name" required></label><label>Area *<input name="area" type="number" step="0.01" min="0.01" required></label><label>Area unit<select name="area_unit"><option>acres</option><option>hectares</option><option>square metres</option></select></label><label>Location<input name="location"></label><label>Notes<textarea name="notes"></textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('crops.index') }}">Cancel</a><button class="btn primary">Save field</button></div></form></section>{% endblock %}
