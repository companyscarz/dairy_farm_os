{% extends 'base.html' %}{% block title %}Add crop season · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Add crop season</h1><p>Track a planting cycle from plan to harvest.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Field *<select name="field_id" required>{% for field in fields %}<option value="{{ field.id }}">{{ field.name }}</option>{% endfor %}</select></label><label>Crop name *<input name="crop_name" placeholder="Maize, beans, coffee..." required></label><label>Variety<input name="variety"></label><label>Season name<input name="season_name" placeholder="2026 Season A"></label><label>Planting date<input type="date" name="planting_date"></label><label>Expected harvest date<input type="date" name="expected_harvest_date"></label><label>Status<select name="status"><option value="planned">Planned</option><option value="growing">Growing</option><option value="harvested">Harvested</option><option value="cancelled">Cancelled</option></select></label><label>Notes<textarea name="notes"></textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('crops.index') }}">Cancel</a><button class="btn primary">Save season</button></div></form></section>{% endblock %}
