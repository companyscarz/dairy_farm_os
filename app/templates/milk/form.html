{% extends 'base.html' %}{% block title %}Record milk · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Record milk</h1><p>Add one milking session to the farm record.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Date *<input type="date" name="production_date" value="{{ request.form.get('production_date','') or '' }}" required></label><label>Session *<select name="session" required><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening</option></select></label><label>Litres *<input type="number" name="litres" min="0" step="0.01" required></label><label>Notes<textarea name="notes"></textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('milk.index') }}">Cancel</a><button class="btn primary">Save record</button></div></form></section>{% endblock %}
