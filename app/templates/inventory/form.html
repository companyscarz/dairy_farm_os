{% extends 'base.html' %}{% block title %}{{ 'Edit' if item else 'Add' }} inventory item · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit inventory item' if item else 'Add inventory item' }}</h1><p>Track quantities and reorder levels.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Item name *<input name="name" required value="{{ item.name if item else '' }}"></label><label>Category *<input name="category" required value="{{ item.category if item else '' }}"></label><label>Quantity *<input type="number" min="0" step="0.01" name="quantity" required value="{{ item.quantity if item else '0' }}"></label><label>Unit *<input name="unit" required value="{{ item.unit if item else '' }}" placeholder="kg, bags, bottles..."></label><label>Reorder level *<input type="number" min="0" step="0.01" name="reorder_level" required value="{{ item.reorder_level if item else '0' }}"></label></div><div class="form-actions"><a class="btn" href="{{ url_for('inventory.index') }}">Cancel</a><button class="btn primary">Save item</button></div></form></section>{% endblock %}
