{% extends 'base.html' %}{% block title %}Record sale · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Record sale</h1><p>Capture a completed farm sale.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Date *<input type="date" name="sale_date" required></label><label>Customer<input name="customer_name"></label><label>Category *<input name="category" placeholder="Milk, animal, manure..." required></label><label>Quantity *<input type="number" name="quantity" min="0.01" step="0.01" required></label><label>Unit *<input name="unit" required placeholder="litres, head, kg..."></label><label>Total (UGX) *<input type="number" name="total" min="0" step="0.01" required></label><label>Notes<textarea name="notes"></textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('sales.index') }}">Cancel</a><button class="btn primary">Save sale</button></div></form></section>{% endblock %}
