{% extends 'base.html' %}{% block title %}{{ 'Edit' if animal else 'Add' }} animal · Intercity Dairy Farm{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit animal' if animal else 'Add animal' }}</h1><p>Keep the herd record accurate and up to date.</p></div></div><section class="panel form-panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Tag *<input name="tag" required value="{{ request.form.get('tag', animal.tag if animal else '') }}"></label><label>Name<input name="name" value="{{ request.form.get('name', animal.name if animal else '') }}"></label><label>Breed<input name="breed" value="{{ request.form.get('breed', animal.breed if animal else '') }}"></label><label>Sex<select name="sex"><option value="female" {{ 'selected' if request.form.get('sex', animal.sex if animal else 'female')=='female' }}>Female</option><option value="male" {{ 'selected' if request.form.get('sex', animal.sex if animal else 'female')=='male' }}>Male</option></select></label><label>Date of birth<input type="date" name="date_of_birth" value="{{ request.form.get('date_of_birth', animal.date_of_birth.isoformat() if animal and animal.date_of_birth else '') }}"></label><label>Status<select name="status"><option value="active" {{ 'selected' if request.form.get('status', animal.status if animal else 'active')=='active' }}>Active</option><option value="sold" {{ 'selected' if request.form.get('status', animal.status if animal else '')=='sold' }}>Sold</option><option value="deceased" {{ 'selected' if request.form.get('status', animal.status if animal else '')=='deceased' }}>Deceased</option><option value="inactive" {{ 'selected' if request.form.get('status', animal.status if animal else '')=='inactive' }}>Inactive</option></select></label><label>Last calving<input type="date" name="last_calving" value="{{ request.form.get('last_calving', animal.last_calving.isoformat() if animal and animal.last_calving else '') }}"></label><label>Cow image (JPG, PNG or WEBP, max 5 MB)<input type="file" name="image" accept="image/jpeg,image/png,image/webp">{% if animal and animal.image_url %}<span class="image-preview"><img src="{{ animal.image_url }}" alt="Current image of {{ animal.tag }}"><small>Current image — choose another file to replace it.</small></span>{% endif %}</label><label>Notes<textarea name="notes">{{ request.form.get('notes', animal.notes if animal else '') }}</textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('animals.index') }}">Cancel</a><button class="btn primary">Save animal</button></div></form></section>{% endblock %}
