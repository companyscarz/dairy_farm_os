{% extends 'base.html' %}{% block title %}{{ 'Edit' if animal else 'Add' }} animal · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit animal' if animal else 'Add animal' }}</h1><p>Keep the herd record accurate and up to date.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Tag *<input name="tag" required value="{{ animal.tag if animal else '' }}"></label><label>Name<input name="name" value="{{ animal.name if animal else '' }}"></label><label>Breed<input name="breed" value="{{ animal.breed if animal else '' }}"></label><label>Sex<select name="sex"><option value="female" {{ 'selected' if not animal or animal.sex=='female' }}>Female</option><option value="male" {{ 'selected' if animal and animal.sex=='male' }}>Male</option></select></label><label>Date of birth<input type="date" name="date_of_birth" value="{{ animal.date_of_birth if animal and animal.date_of_birth else '' }}"></label><label>Status<select name="status"><option value="active" {{ 'selected' if not animal or animal.status=='active' }}>Active</option><option value="sold" {{ 'selected' if animal and animal.status=='sold' }}>Sold</option><option value="deceased" {{ 'selected' if animal and animal.status=='deceased' }}>Deceased</option><option value="inactive" {{ 'selected' if animal and animal.status=='inactive' }}>Inactive</option></select></label><label>Last calving<input type="date" name="last_calving" value="{{ animal.last_calving if animal and animal.last_calving else '' }}"></label><label>Notes<textarea name="notes">{{ animal.notes if animal else '' }}</textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('animals.index') }}">Cancel</a><button class="btn primary">Save animal</button></div></form></section>{% endblock %}
