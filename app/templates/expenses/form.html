{% extends 'base.html' %}{% block title %}Record expense · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Record expense</h1><p>Capture a farm cost for accurate reporting.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Date *<input type="date" name="expense_date" required></label><label>Category *<input name="category" placeholder="Feed, veterinary, labour..." required></label><label>Amount (UGX) *<input type="number" name="amount" min="0" step="0.01" required></label><label>Description<textarea name="description"></textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('expenses.index') }}">Cancel</a><button class="btn primary">Save expense</button></div></form></section>{% endblock %}
