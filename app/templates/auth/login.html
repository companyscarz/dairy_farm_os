{% extends 'base.html' %}{% block title %}Sign in · FarmOS{% endblock %}
{% block auth_content %}<div class="auth-page"><div class="auth-card"><div class="auth-logo">F</div><h1>Welcome to FarmOS</h1><p>Manage your dairy farm from anywhere.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide">Sign in</button></form>{% if not request.path.endswith('/setup') %}<a class="muted-link" href="{{ url_for('auth.setup') }}">First time setup</a>{% endif %}</div></div>{% endblock %}
