{% extends 'base.html' %}{% block title %}Initial setup · FarmOS{% endblock %}
{% block auth_content %}<div class="auth-page"><div class="auth-card wide-card"><div class="auth-logo">F</div><h1>Set up your farm</h1><p>Tell FarmOS what you run so your workspace can grow with your farm.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Farm name *<input name="farm_name" required></label><label>Farm type *<select name="farm_type"><option value="dairy">Dairy</option><option value="crop">Crop</option><option value="poultry">Poultry</option><option value="pig">Pig</option><option value="fish">Fish / Aquaculture</option><option value="mixed">Mixed farm</option><option value="other">Other</option></select></label><label>Farm location<input name="location"></label><label>Farm phone<input name="phone"></label><label>Farm email<input name="farm_email" type="email"></label><label>Your name *<input name="name" required></label><label>Your email *<input name="email" type="email" required></label><label>Password *<input name="password" type="password" minlength="10" required></label><label>Confirm password *<input name="confirm_password" type="password" minlength="10" required></label></div><button class="btn primary wide">Create administrator</button></form></div></div>{% endblock %}
