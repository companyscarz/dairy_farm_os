{% extends 'base.html' %}{% block title %}Settings · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Settings</h1><p>Manage your farm profile and account security.</p></div></div><div class="two-col"><section class="panel form-panel"><div class="panel-head"><div><h2>Farm profile</h2><p>Information shown throughout the application.</p></div></div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Farm name *<input name="name" value="{{ farm.name }}" required></label><label>Location<input name="location" value="{{ farm.location or '' }}"></label><label>Phone<input name="phone" value="{{ farm.phone or '' }}"></label><label>Email<input type="email" name="email" value="{{ farm.email or '' }}"></label><label>Currency<select name="currency"><option value="UGX" {{ 'selected' if farm.currency=='UGX' }}>UGX</option><option value="USD" {{ 'selected' if farm.currency=='USD' }}>USD</option></select></label><label>Timezone<input name="timezone" value="{{ farm.timezone }}"></label></div><div class="form-actions"><button class="btn primary">Save settings</button></div></form></section><section class="panel form-panel"><div class="panel-head"><div><h2>Change password</h2><p>Use a strong password of at least 10 characters.</p></div></div><form method="post" action="{{ url_for('settings.password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="10" required></label><div class="form-actions"><button class="btn primary">Change password</button></div></form></section></div>{% endblock %}
