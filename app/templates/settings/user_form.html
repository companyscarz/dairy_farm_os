{% extends 'base.html' %}{% block title %}Add user · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Add farm user</h1><p>Create an account or add an existing FarmOS account to this farm.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Full name *<input name="name" required></label><label>Email *<input type="email" name="email" required></label><label>Role *<select name="role"><option value="worker">Worker</option><option value="manager">Manager</option><option value="owner">Owner</option></select></label><label>Password *<input type="password" name="password" minlength="10" required><small class="help">For a new account. Existing users keep their current password.</small></label></div><div class="form-actions"><a class="btn" href="{{ url_for('settings.users') }}">Cancel</a><button class="btn primary">Add user</button></div></form></section>{% endblock %}
