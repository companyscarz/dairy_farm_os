{% extends 'base.html' %}{% block title %}Add farm · FarmOS{% endblock %}{% block content %}<div class="page-head"><div><h1>Add another farm</h1><p>One account can manage farms with completely different operations.</p></div></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Farm name *<input name="name" required></label><label>Farm type *<select name="farm_type">{% for key,label in farm_types.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>Location<input name="location"></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Currency<select name="currency"><option>UGX</option><option>USD</option></select></label><label>Timezone<input name="timezone" value="Africa/Kampala"></label></div><div class="form-actions"><a class="btn" href="{{ url_for('settings.farms') }}">Cancel</a><button class="btn primary">Create farm</button></div></form></section>{% endblock %}
